[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
preDeployCommand = "./node_modules/.bin/tsx scripts/with-env.ts ./node_modules/.bin/drizzle-kit migrate --config=drizzle.config.ts"
healthcheckPath = "/api/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
